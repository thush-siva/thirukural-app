<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thirukkural</title>
<meta name="description" content="A visual Thirukkural reader. Three 3D sections, chapter cards, and a scrolling reader where you can tap any Tamil word for its meaning.">
<meta name="theme-color" content="#211508">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Tamil&family=Anek+Tamil:wght@400;600&family=Noto+Sans+Tamil:wght@500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main id="phone" class="phone" aria-label="Thirukkural app prototype">

  <div class="glow" aria-hidden="true"></div>

  <!-- Home header -->
  <header class="home-head">
    <h1 lang="ta">திருக்குறள்</h1>
    <p>Three sections. 133 chapters. 1,330 kurals.</p>
  </header>

  <!-- Open-section header -->
  <div class="open-head">
    <button type="button" class="glass round" id="close-section" aria-label="Back to all sections">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <span class="glass chip" id="open-chip">Section II · Wealth</span>
  </div>

  <!-- 3D sections -->
  <div class="stage" id="stage">
    <div class="shelf" id="shelf"></div>
  </div>

  <!-- Home info -->
  <section class="home-info" aria-live="polite">
    <div class="info-text">
      <div class="dots" id="dots" aria-hidden="true"></div>
      <span class="kicker" id="info-kicker">Section II · 70 chapters</span>
      <span class="info-ta" lang="ta" id="info-ta">பொருட்பால்</span>
      <span class="info-en" id="info-en">Wealth · Kurals 381–1080</span>
    </div>
    <button type="button" class="glass pill-btn" id="open-section">
      Open
      <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </section>

  <!-- Chapters in the open section -->
  <section class="chapters" aria-label="Chapters">
    <div class="ch-info" aria-live="polite">
      <span class="kicker" id="ch-kicker">Chapter 40 · 3 of 10 read</span>
      <span class="ch-info-ta" lang="ta" id="ch-ta">கல்வி</span>
      <span class="ch-info-en" id="ch-en">Learning</span>
    </div>
    <div class="ch-row" id="ch-row"></div>
    <div class="ch-actions">
      <button type="button" class="glass resume" id="resume">
        <span class="resume-icon" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg></span>
        <span id="resume-label">Continue chapter 40</span>
      </button>
    </div>
  </section>

  <!-- Tab bar -->
  <nav class="tabbar" aria-label="Main">
    <div class="glass tabs">
      <button type="button" class="tab active" aria-current="page">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4z"/><path d="M20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg>
        Thirukkural
      </button>
      <button type="button" class="tab" data-toast="Saved kurals are the next screen to design.">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
        Saved
      </button>
    </div>
    <button type="button" class="glass round big" aria-label="Ask: find a kural for a moment" data-toast="Ask, a kural for any moment, is in design.">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    </button>
  </nav>

  <!-- Reader -->
  <section class="reader" id="reader" aria-label="Kural reader" aria-hidden="true">
    <div class="r-stage" id="r-stage">
      <div class="r-track" id="r-track"></div>
    </div>

    <div class="pull-hint" id="pull-hint" aria-hidden="true">Release to return to Wealth</div>

    <header class="r-head">
      <button type="button" class="glass round" id="r-back" aria-label="Back to Section II, Wealth">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <span class="r-title">
        <span lang="ta" id="r-ta">கல்வி</span>
        <span id="r-sub">Chapter 40 · Learning</span>
      </span>
    </header>

    <nav class="r-dots" id="r-dots" aria-label="Kurals in this chapter"></nav>

    <div class="r-actions">
      <button type="button" class="act play" id="r-play" aria-label="Listen">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path id="r-play-icon" d="M7 4.5v15l12-7.5z"/></svg>
      </button>
      <button type="button" class="act glass" id="r-study" aria-label="Word by word" aria-pressed="false">
        <span aria-hidden="true" lang="ta" class="ta-glyph">அ</span>
      </button>
      <button type="button" class="act glass" id="r-save" aria-label="Save kural" aria-pressed="false">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
      </button>
      <button type="button" class="act glass" id="r-share" aria-label="Share kural">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="M7 8l5-5 5 5"/><path d="M5 14v6h14v-6"/></svg>
      </button>
    </div>

    <button type="button" class="r-next" id="r-next">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
      <span id="r-next-label">Kural 392</span>
    </button>

    <section class="sheet" id="sheet" aria-label="Word meaning" aria-hidden="true">
      <div class="sheet-top">
        <span class="kicker" id="s-pos">Word 1 of 7</span>
        <button type="button" class="sheet-close" id="s-close" aria-label="Close word meaning">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <span class="s-ta" lang="ta" id="s-ta"></span>
      <span class="s-tr" id="s-tr"></span>
      <span class="s-gloss" id="s-gloss"></span>
      <div class="sheet-nav">
        <button type="button" class="s-prev" id="s-prev">Previous word</button>
        <button type="button" class="s-next" id="s-next">Next word</button>
      </div>
    </section>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
